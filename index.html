<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Name — Portfolio</title>
  <meta name="description" content="Portfolio: design and engineering.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!--
    PLACEHOLDERS: everything marked with data-placeholder should be replaced
    with your own content (name, photo, text, links).
  -->

  <header class="topbar">
    <nav class="nav" aria-label="Main">
      <a href="#" class="nav__link is-active" aria-current="page">Home</a>
      <a href="#" class="nav__link">Designs</a>
      <a href="#" class="nav__link">Engineering</a>
      <a href="#" class="nav__link">About</a>
      <a href="#" class="nav__link">Contact</a>
    </nav>
  </header>

  <main class="hero">
    <div class="hero__inner">
      <!-- PLACEHOLDER: replace with <img src="avatar.jpg" alt="Your Name"> -->
      <div class="avatar" data-placeholder role="img" aria-label="Photo placeholder">
        <span>YN</span>
      </div>

      <h1 class="hero__title" data-placeholder>
        <span class="hero__title-text">Your Profession</span><span class="hero__title-line" aria-hidden="true"></span>
      </h1>

      <p class="hero__links">
        <a href="mailto:you@example.com" data-placeholder>email</a>
        <span aria-hidden="true">x</span>
        <a href="https://github.com/" data-placeholder>github</a>
      </p>

      <div class="hero__bio" data-placeholder>
        <p>One or two sentences about what you do and who you do it for.</p>
        <p>Previously at <a href="#" class="dotted">Company</a>.</p>
      </div>

      <p class="hero__status">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="hero__status-text">Open to full-time roles, contracts and projects.</span>
        <a href="#" class="cta">Book a call <span aria-hidden="true">→</span></a>
      </p>
    </div>

    <ul class="socials" data-placeholder>
      <li><a href="#">LinkedIn</a></li>
      <li><a href="#">Dribbble</a></li>
      <li><a href="#">Instagram</a></li>
      <li><a href="#">Behance</a></li>
      <li><a href="#">Telegram</a></li>
    </ul>
  </main>
</body>
</html>
